<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Daniel León — AI-assisted software and LLM evaluation">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect x="7" y="7" width="2" height="2" fill="#1f2a3a"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="screen"><rect x="804" y="70" width="300" height="180" rx="6"/></clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .px { animation: twinkle 3.2s ease-in-out infinite; }
      .px:nth-of-type(2n) { animation-delay: .8s; }
      .px:nth-of-type(3n) { animation-delay: 1.6s; }
      .px:nth-of-type(5n) { animation-delay: 2.4s; }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: 1 } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
      .line { opacity: 0; animation: show 9s infinite; }
      .l1 { animation-delay: .3s } .l2 { animation-delay: 1.3s } .l3 { animation-delay: 2.3s }
      .l4 { animation-delay: 3.3s } .l5 { animation-delay: 4.3s }
      @keyframes show { 0% { opacity: 0 } 4% { opacity: 1 } 85% { opacity: 1 } 92%,100% { opacity: 0 } }
      .bar { transform-origin: left; animation: grow 9s ease-out infinite; }
      @keyframes grow { 0%,45% { transform: scaleX(0) } 60%,85% { transform: scaleX(1) } 92%,100% { transform: scaleX(0) } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="#0d1117"/>
  <rect width="1200" height="320" fill="url(#dots)"/>

  <!-- pixel sparks -->
  <g fill="#22d3ee">
    <rect class="px" x="96" y="40" width="6" height="6"/>
    <rect class="px" x="560" y="52" width="4" height="4"/>
    <rect class="px" x="700" y="270" width="6" height="6"/>
    <rect class="px" x="1150" y="40" width="4" height="4"/>
    <rect class="px" x="740" y="34" width="4" height="4"/>
  </g>
  <g fill="#7c5cff">
    <rect class="px" x="40" y="262" width="4" height="4"/>
    <rect class="px" x="640" y="120" width="6" height="6"/>
    <rect class="px" x="1160" y="280" width="6" height="6"/>
    <rect class="px" x="470" y="282" width="4" height="4"/>
  </g>

  <!-- left: identity -->
  <text x="72" y="118" class="mono" font-size="16" fill="#7d8590">~/medellin $ whoami</text>
  <text x="70" y="176" class="sans" font-size="58" font-weight="800" fill="#e6edf3" letter-spacing="1">Daniel León</text>
  <rect x="72" y="194" width="200" height="4" fill="url(#glow)"/>
  <text x="72" y="232" class="sans" font-size="20" fill="#c9d1d9">Building software with AI agents · Evaluating LLMs</text>
  <text x="72" y="262" class="mono" font-size="15" fill="#7d8590">co-founder @ movo · MIND · EternalGrowth  |  Systems Engineering @ UPB</text>

  <!-- right: terminal running an eval -->
  <rect x="790" y="44" width="328" height="222" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="810" cy="60" r="5" fill="#ff5f57"/>
  <circle cx="826" cy="60" r="5" fill="#febc2e"/>
  <circle cx="842" cy="60" r="5" fill="#28c840"/>
  <text x="954" y="64" class="mono" font-size="12" fill="#7d8590" text-anchor="middle">arena.py bench</text>
  <g clip-path="url(#screen)" class="mono" font-size="13">
    <text class="line l1" x="806" y="98" fill="#7d8590">$ python arena.py bench</text>
    <text class="line l2" x="806" y="122" fill="#c9d1d9">judge: blind · both orders</text>
    <text class="line l3" x="806" y="146" fill="#c9d1d9">position consistency <tspan fill="#3fb950">91%</tspan></text>
    <g class="line l4">
      <text x="806" y="176" fill="#c9d1d9">model A</text>
      <rect class="bar" x="876" y="166" width="190" height="10" rx="2" fill="#7c5cff"/>
      <text x="806" y="198" fill="#c9d1d9">model B</text>
      <rect class="bar" x="876" y="188" width="172" height="10" rx="2" fill="#4f8cff"/>
      <text x="806" y="220" fill="#c9d1d9">model C</text>
      <rect class="bar" x="876" y="210" width="120" height="10" rx="2" fill="#22d3ee"/>
    </g>
    <text class="line l5" x="806" y="246" fill="#3fb950">report → results/report.html<tspan class="cursor" fill="#e6edf3"> █</tspan></text>
  </g>

  <rect y="290" width="1200" height="30" fill="url(#fade)"/>
</svg>
